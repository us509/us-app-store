<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>App Store</title>
<style>
:root{
  --bg:#f3f4fb;--card:#ffffff;--text:#1a1b2e;--muted:#62657a;--line:#e3e5f2;
  --a1:#4f46e5;--a2:#7c3aed;--a3:#db2777;--onaccent:#ffffff;--chip:#eceefd;--shadow:0 6px 20px rgba(60,64,140,.12);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1020;--card:#1a1b30;--text:#eef0ff;--muted:#a3a6c4;--line:#2b2d4a;--chip:#26284a;--shadow:0 6px 20px rgba(0,0,0,.45);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
a{color:inherit}
.top{background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));color:var(--onaccent);
  padding:calc(14px + env(safe-area-inset-top,0)) 16px 22px;border-radius:0 0 28px 28px;box-shadow:var(--shadow);position:relative}
.bar{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
#menuBtn,.iconbtn{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
#menuBtn:focus-visible,.btn:focus-visible,.tile:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffd54f;outline-offset:2px}
.top h1{margin:0;font-size:1.5rem;line-height:1.2;text-align:center;overflow-wrap:anywhere}
#tagline{margin:4px 0 0;font-size:.92rem;opacity:.92;text-align:center}
.greet{margin:12px 0 0;font-size:.98rem;font-weight:600;text-align:center}
.greet span{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;line-height:1.35}
.search{margin-top:14px}
.search input{width:100%;border:0;border-radius:14px;padding:13px 16px;font-size:1rem;background:rgba(255,255,255,.95);color:#1a1b2e}
.search input::placeholder{color:#6b6e86}
main{max-width:760px;margin:0 auto;padding:18px 14px 30px}
body.has-bar main{padding-bottom:130px}
.stats{margin:2px 4px 10px;color:var(--muted);font-size:.92rem;text-align:center}
main:focus{outline:none}
h2{font-size:1.2rem;margin:22px 4px 10px}
h2:first-child{margin-top:4px}
h2:focus{outline:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:14px 6px;border-radius:18px;
  text-decoration:none;color:#fff;min-height:104px;box-shadow:var(--shadow);border:0;cursor:pointer}
.tile .ic{font-size:2rem;line-height:1}
.tile .nm{font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.tile .ct{font-size:.75rem;opacity:.92}
.c0{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.c1{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.c2{background:linear-gradient(135deg,#06b6d4,#3b82f6)}.c3{background:linear-gradient(135deg,#10b981,#14b8a6)}
.c4{background:linear-gradient(135deg,#f59e0b,#ef4444)}.c5{background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.c6{background:linear-gradient(135deg,#0ea5e9,#6366f1)}.c7{background:linear-gradient(135deg,#84cc16,#10b981)}
.card{background:var(--card);border-radius:20px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start}
.icon{width:58px;height:58px;border-radius:15px;flex:none;object-fit:cover;background:linear-gradient(135deg,var(--a1),var(--a3));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;overflow:hidden}
.icon.big{width:84px;height:84px;border-radius:22px;font-size:2.3rem}
.info{min-width:0;flex:1}
.info h3{margin:0;font-size:1.08rem}
.info h3 a{text-decoration:none}
.meta{margin:2px 0;color:var(--muted);font-size:.84rem}
.desc{margin:6px 0 0;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.full{display:block;-webkit-line-clamp:unset;white-space:pre-wrap;margin-top:10px}
.tag{display:inline-block;background:var(--chip);color:var(--a1);border-radius:999px;padding:1px 10px;font-size:.74rem;font-weight:700;margin-left:6px;vertical-align:middle}
@media (prefers-color-scheme: dark){.tag{color:#c4b5fd}}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 10px;font-weight:700;font-size:.95rem;
  text-decoration:none;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onaccent)}
.btn.alt{background:var(--chip);color:var(--text);flex:none;min-width:48px}
.btn.fav[aria-pressed="true"]{background:#ffe3ec;color:#d6204e}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;justify-content:center;
  padding:10px 12px calc(14px + env(safe-area-inset-bottom,0));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(30,30,80,.16)}
.actionbar .inner{display:flex;gap:8px;width:100%;max-width:736px}
.actionbar .btn{flex-direction:column;gap:0;line-height:1.2}
.actionbar .btn small{font-weight:500;font-size:.72rem;opacity:.9}
.actionbar .alt{flex:none;min-width:52px}
.back{display:inline-block;margin:0 0 8px 4px;color:var(--a1);font-weight:700;text-decoration:none}
@media (prefers-color-scheme: dark){.back{color:#c4b5fd}}
.ver{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ver .vi{min-width:0;flex:1 1 150px}
.ver .vi b{font-size:1rem}
.ver .vn{font-size:.85rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.ver .btn{flex:none;padding:10px 14px}
.hl{background:var(--chip);border-radius:14px;padding:12px}
.notice{background:#fff3cd;color:#5c4400;border-radius:16px;padding:12px 14px;margin:0 0 14px;white-space:pre-wrap}
@media (prefers-color-scheme: dark){.notice{background:#3a3217;color:#ffe9a6}}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.page p{white-space:pre-wrap;margin:6px 4px}
#backdrop{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);background:var(--card);z-index:30;transform:translateX(-105%);transition:transform .22s,visibility .22s;
  padding:calc(18px + env(safe-area-inset-top,0)) 14px 18px;box-shadow:var(--shadow);overflow-y:auto;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer h2{margin:4px 8px 12px;font-size:1.15rem}
#drawer a{display:flex;gap:12px;align-items:center;padding:14px 12px;border-radius:14px;text-decoration:none;font-weight:600;font-size:1rem}
#drawer a:hover,#drawer a:focus-visible,#drawer .mi:hover,#drawer .mi:focus-visible{background:var(--chip)}
#drawer .mi{display:flex;gap:12px;align-items:center;width:100%;padding:14px 12px;border-radius:14px;border:0;background:none;text-align:left;font-weight:600;font-size:1rem;cursor:pointer}
.steps{margin:6px 4px;padding-left:22px}.steps li{margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);background:#1a1b2e;color:#fff;padding:11px 18px;border-radius:999px;
  opacity:0;transition:all .25s;z-index:40;pointer-events:none;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.has-bar #toast{bottom:calc(104px + env(safe-area-inset-bottom,0))}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:6px 0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">☰</button>
    <h1 id="title">App Store</h1>
    <a class="iconbtn" id="favTop" href="#favs" aria-label="Favourites">❤️</a>
  </div>
  <p id="tagline"></p>
  <p class="greet" id="greet" role="status"></p>
  <div class="search"><label class="sr" for="q">Search apps</label><input id="q" type="search" placeholder="Search apps" autocomplete="off"></div>
</header>

<div id="backdrop"></div>
<nav id="drawer" aria-label="Menu" aria-hidden="true">
  <h2 id="drawerTitle">Menu</h2>
  <a href="#home">🏠 Home</a>
  <a href="#cats">🗂️ Categories</a>
  <a href="#new">🆕 New Apps</a>
  <a href="#featured">⭐ Featured</a>
  <a href="#favs">❤️ Favourites</a>
  <a href="#about">ℹ️ About</a>
  <a href="#contact">✉️ Contact</a>
  <a href="#install" id="installLink">📲 Install app</a>
  <button type="button" id="fsBtn" class="mi">⛶ Full screen</button>
</nav>

<main id="view" tabindex="-1"></main>
<footer id="foot"></footer>
<div id="actionbar" class="actionbar" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var DATA = {title:"App Store", tagline:"", about:"", contact:"", notice:"", categories:[], apps:[]};
  var counts = {};
  var favs = {};
  var $ = function(id){ return document.getElementById(id); };
  var IN_PANEL = /USPanel/.test(navigator.userAgent);

  /* ---------- helpers ---------- */
  function el(tag, props, kids){
    var e = document.createElement(tag);
    if (props) for (var k in props){
      if (k === "text") e.textContent = props[k];
      else if (k === "cls") e.className = props[k];
      else e.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function safeUrl(u){ u = String(u || ""); return /^https?:\/\//i.test(u) ? u : "#"; }
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }
  function fmtSize(b){
    b = Number(b) || 0; if (!b) return "";
    if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
    return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + " MB";
  }
  function loadFavs(){ try { favs = JSON.parse(localStorage.getItem("usstore_favs") || "{}") || {}; } catch(e){ favs = {}; } }
  function saveFavs(){ try { localStorage.setItem("usstore_favs", JSON.stringify(favs)); } catch(e){} }

  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function greeting(){
    var h = new Date().getHours();
    if (h >= 5 && h < 12) return "🌅 Good morning";
    if (h >= 12 && h < 17) return "☀️ Good afternoon";
    if (h >= 17 && h < 21) return "🌇 Good evening";
    return "🌙 Good night";
  }
  function fmtDate(iso, short){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    if (!m) return "";
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var mon = MONTHS[d.getMonth()];
    return DAYS[d.getDay()] + ", " + d.getDate() + " " + (short ? mon.slice(0, 3) : mon) + " " + d.getFullYear();
  }
  function todayText(){
    var d = new Date();
    return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  /* ---------- data ---------- */
  function normalize(d){
    d = d || {};
    var out = {title: d.title || "App Store", tagline: d.tagline || "", about: d.about || "", contact: d.contact || "", notice: d.notice || "", categories: [], apps: []};
    var catById = {};
    (d.categories || []).forEach(function(c){
      if (!c || !c.id) return;
      var cc = {id: String(c.id), name: c.name || c.id, icon: c.icon || "📁"};
      out.categories.push(cc); catById[cc.id] = cc;
    });
    (d.apps || []).forEach(function(a){
      if (!a) return;
      var app = {id: String(a.id || a.name || ""), name: a.name || "App", category: a.category || "", desc: a.desc || "", icon: a.icon || "",
                 featured: !!a.featured, hidden: !!a.hidden, date: a.date || "", versions: []};
      if (a.versions && a.versions.length){
        a.versions.forEach(function(v){ app.versions.push({version: String(v.version || ""), url: v.url || "", size: v.size || 0, date: v.date || "", note: v.note || "", downloads: Number(v.downloads) || 0}); });
      } else {                       /* old store format */
        if (a.url) app.versions.push({version: String(a.version || ""), url: a.url, size: a.size || 0, date: a.date || "", note: ""});
        (a.history || []).forEach(function(v){ app.versions.push({version: String(v.version || ""), url: v.url || "", size: 0, date: v.date || "", note: ""}); });
      }
      if (!app.date && app.versions.length) app.date = app.versions[0].date;
      if (app.category && !catById[app.category]){
        var guess = {id: app.category, name: app.category, icon: "📁"};
        out.categories.push(guess); catById[guess.id] = guess;
      }
      out.apps.push(app);
    });
    return out;
  }
  function catOf(id){ for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].id === id) return DATA.categories[i]; return null; }
  function visibleApps(){ return DATA.apps.filter(function(a){ return !a.hidden && a.versions.length; }); }
  function byDateDesc(a, b){ return String(b.date).localeCompare(String(a.date)); }
  function appById(id){ for (var i = 0; i < DATA.apps.length; i++) if (DATA.apps[i].id === id) return DATA.apps[i]; return null; }
  function dlOfVersion(v){ return counts[v.url] !== undefined ? counts[v.url] : (v.downloads || 0); }
  function downloadsOf(app){
    var n = 0;
    app.versions.forEach(function(v){ n += dlOfVersion(v); });
    return n;
  }
  function totalDownloads(){
    var n = 0;
    DATA.apps.forEach(function(a){ n += downloadsOf(a); });
    return n;
  }
  function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }

  /* ---------- share & favourite ---------- */
  function appLink(app, ver){
    var base = location.href.split("#")[0];
    return base + "#app/" + encodeURIComponent(app.id) + (ver ? "/" + encodeURIComponent(ver) : "");
  }
  function legacyCopy(text){
    var t = el("textarea", {"aria-hidden": "true"}); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Link copied"); } catch(e){ toast(text); }
    document.body.removeChild(t);
  }
  function copyText(text){
    if (IN_PANEL){ location.href = "uscopy://go?text=" + encodeURIComponent(text); toast("Link copied"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Link copied"); }, function(){ legacyCopy(text); });
    } else legacyCopy(text);
  }
  function share(app, ver){
    var url = appLink(app, ver);
    var text = app.name + (ver ? " " + ver : "") + " - get it from " + DATA.title;
    if (IN_PANEL){ location.href = "usshare://go?text=" + encodeURIComponent(text + "\n" + url); return; }
    if (navigator.share){ navigator.share({title: app.name, text: text, url: url}).catch(function(){}); return; }
    copyText(url);
  }
  function favLabel(app, on){ return (on ? "Remove " : "Add ") + app.name + (on ? " from favourites" : " to favourites"); }
  function toggleFav(app, btn){
    if (favs[app.id]) delete favs[app.id]; else favs[app.id] = 1;
    saveFavs();
    var on = !!favs[app.id];
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? "❤️" : "🤍";
    btn.setAttribute("aria-label", favLabel(app, on));
    toast(on ? "Added to favourites" : "Removed from favourites");
    if (/^#favs/.test(location.hash)) render();
  }
  function favButton(app){
    var on = !!favs[app.id];
    var b = el("button", {cls: "btn alt fav", type: "button", "aria-pressed": on ? "true" : "false", "aria-label": favLabel(app, on), text: on ? "❤️" : "🤍"});
    b.addEventListener("click", function(){ toggleFav(app, b); });
    return b;
  }
  function copyButton(app, ver, url){
    var b = el("button", {cls: "btn alt", type: "button", "aria-label": "Copy the download link of " + app.name + (ver ? " version " + ver : ""), text: "🔗"});
    b.addEventListener("click", function(){ copyText(url); });
    return b;
  }
  function dlAnchor(app, ver, url, label, cls, extra){
    var a = el("a", {cls: cls || "btn", href: safeUrl(url), rel: "noopener", "aria-label": "Download " + app.name + " " + ver, "data-dl": "1"});
    a.appendChild(document.createTextNode(label));
    if (extra){ a.appendChild(document.createElement("br")); a.appendChild(el("small", {text: extra})); }
    a.addEventListener("click", function(){ toast("Download started: " + app.name + " " + ver + ". Check your notifications."); });
    return a;
  }
  function shareButton(app, ver, compact){
    var b = el("button", {cls: "btn alt", type: "button", "aria-label": "Share " + app.name + (ver ? " version " + ver : ""), text: compact ? "📤" : "Share"});
    b.addEventListener("click", function(){ share(app, ver); });
    return b;
  }

  /* ---------- building blocks ---------- */
  function letterIcon(app, big){
    return el("div", {cls: "icon" + (big ? " big" : ""), "aria-hidden": "true", text: (app.name || "?").charAt(0).toUpperCase()});
  }
  function iconOf(app, big){
    if (app.icon && /^https?:\/\//i.test(app.icon)){
      var img = el("img", {cls: "icon" + (big ? " big" : ""), src: app.icon, alt: "", loading: "lazy"});
      img.addEventListener("error", function(){ if (img.parentNode) img.parentNode.replaceChild(letterIcon(app, big), img); });
      return img;
    }
    return letterIcon(app, big);
  }
  function appCard(app){
    var v = app.versions[0];
    var cat = catOf(app.category);
    var meta = "Version " + v.version;
    if (cat) meta += " · " + cat.name;
    var sz = fmtSize(v.size); if (sz) meta += " · " + sz;
    var h3 = el("h3", null, [el("a", {href: "#app/" + encodeURIComponent(app.id), text: app.name})]);
    if (app.featured) h3.appendChild(el("span", {cls: "tag", text: "Featured"}));
    var n = downloadsOf(app);
    return el("article", {cls: "card"}, [
      el("div", {cls: "row"}, [iconOf(app, false), el("div", {cls: "info"}, [
        h3, el("p", {cls: "meta", text: meta}),
        app.date ? el("p", {cls: "meta", text: "Uploaded: " + fmtDate(app.date, true)}) : null,
        el("p", {cls: "meta", text: "⬇ " + plural(n, "download")}),
        app.desc ? el("p", {cls: "desc", text: app.desc}) : null])]),
      el("div", {cls: "actions"}, [
        dlAnchor(app, v.version, v.url, "⬇ Download"),
        copyButton(app, "", v.url), shareButton(app, ""), favButton(app)
      ])
    ]);
  }
  function section(titleText){ return el("h2", {text: titleText, tabindex: "-1"}); }
  function appList(apps, emptyText){
    var box = el("div");
    if (!apps.length) box.appendChild(el("p", {cls: "empty", text: emptyText || "No apps here yet."}));
    apps.forEach(function(a){ box.appendChild(appCard(a)); });
    return box;
  }
  function catTile(c, i){
    var n = visibleApps().filter(function(a){ return a.category === c.id; }).length;
    var word = n === 1 ? " app" : " apps";
    return el("a", {cls: "tile c" + (i % 8), href: "#cat/" + encodeURIComponent(c.id), "aria-label": c.name + ", " + n + word}, [
      el("span", {cls: "ic", "aria-hidden": "true", text: c.icon}), el("span", {cls: "nm", text: c.name}), el("span", {cls: "ct", text: n + word})
    ]);
  }
  function catGrid(){
    var g = el("div", {cls: "grid3"});
    DATA.categories.forEach(function(c, i){ g.appendChild(catTile(c, i)); });
    return g;
  }

  /* ---------- views ---------- */
  var VIEW = $("view");
  function setView(title, nodes){
    hideBar();
    VIEW.innerHTML = "";
    nodes.forEach(function(n){ if (n) VIEW.appendChild(n); });
    document.title = title + " - " + DATA.title;
    window.scrollTo(0, 0);
    var h = VIEW.querySelector("h2");
    try { (h || VIEW).focus({preventScroll: true}); } catch(e){}
  }
  function viewHome(){
    var nodes = [];
    if (DATA.notice) nodes.push(el("div", {cls: "notice", role: "note", text: DATA.notice}));
    var shown = visibleApps();
    nodes.push(el("p", {cls: "stats", text: plural(shown.length, "app") + " · " + plural(totalDownloads(), "download")}));
    nodes.push(section("Categories"));
    nodes.push(DATA.categories.length ? catGrid() : el("p", {cls: "empty", text: "No categories yet."}));
    var feat = visibleApps().filter(function(a){ return a.featured; }).sort(byDateDesc);
    if (feat.length){ nodes.push(section("⭐ Featured")); nodes.push(appList(feat)); }
    var fresh = visibleApps().sort(byDateDesc).slice(0, 5);
    if (fresh.length){ nodes.push(section("🆕 New apps")); nodes.push(appList(fresh)); }
    setView("Home", nodes);
  }
  function viewCats(){ setView("Categories", [section("Categories"), DATA.categories.length ? catGrid() : el("p", {cls: "empty", text: "No categories yet."})]); }
  function viewCat(id){
    var c = catOf(id);
    if (!c) return viewHome();
    var apps = visibleApps().filter(function(a){ return a.category === id; }).sort(byDateDesc);
    setView(c.name, [el("a", {cls: "back", href: "#home", text: "← Home"}), section(c.icon + " " + c.name + " (" + apps.length + ")"), appList(apps, "No apps in this category yet.")]);
  }
  function viewNew(){ setView("New Apps", [section("🆕 New apps"), appList(visibleApps().sort(byDateDesc).slice(0, 20), "No apps yet.")]); }
  function viewFeatured(){ setView("Featured", [section("⭐ Featured"), appList(visibleApps().filter(function(a){ return a.featured; }).sort(byDateDesc), "No featured apps yet.")]); }
  function viewFavs(){
    var apps = visibleApps().filter(function(a){ return favs[a.id]; }).sort(byDateDesc);
    setView("Favourites", [section("❤️ Favourites (" + apps.length + ")"), appList(apps, "You have no favourites yet. Tap 🤍 on any app to add it here.")]);
  }
  function viewPage(title, text){
    setView(title, [el("div", {cls: "page"}, [section(title), el("p", {text: text || "Nothing here yet."})])]);
  }
  function viewApp(id, hiVer){
    var app = appById(id);
    if (!app || !app.versions.length) return viewHome();
    var v = app.versions[0], cat = catOf(app.category);
    var total = downloadsOf(app);
    var meta = "Latest: version " + v.version + (fmtSize(v.size) ? " · " + fmtSize(v.size) : "");
    var head = el("div", {cls: "card"}, [
      el("div", {cls: "row"}, [iconOf(app, true), el("div", {cls: "info"}, [
        el("h2", {text: app.name, tabindex: "-1", style: "margin:0"}),
        cat ? el("p", {cls: "meta", text: cat.icon + " " + cat.name}) : null,
        el("p", {cls: "meta", text: meta}),
        app.date ? el("p", {cls: "meta", text: "Uploaded: " + fmtDate(app.date)}) : null,
        el("p", {cls: "meta", text: "⬇ " + plural(total, "download") + " in total"})
      ])]),
      app.desc ? el("p", {cls: "desc full", text: app.desc}) : null
    ]);
    var vers = el("div", {cls: "card"}, [el("h2", {text: "All versions (" + app.versions.length + ")", style: "margin:0 0 6px", tabindex: "-1"})]);
    app.versions.forEach(function(ver, i){
      var bits = [];
      if (ver.date) bits.push("Uploaded: " + fmtDate(ver.date, true));
      if (fmtSize(ver.size)) bits.push(fmtSize(ver.size));
      bits.push(plural(dlOfVersion(ver), "download"));
      var left = el("div", {cls: "vi"}, [
        el("b", {text: "Version " + ver.version}),
        i === 0 ? el("span", {cls: "tag", text: "Latest"}) : null,
        el("div", {cls: "vn", text: bits.join(" · ")}),
        ver.note ? el("div", {cls: "vn", text: ver.note}) : null
      ]);
      vers.appendChild(el("div", {cls: "ver" + (hiVer && hiVer === ver.version ? " hl" : "")}, [
        left,
        dlAnchor(app, ver.version, ver.url, "⬇"),
        copyButton(app, ver.version, ver.url),
        shareButton(app, ver.version, true)
      ]));
    });
    setView(app.name, [el("a", {cls: "back", href: cat ? "#cat/" + encodeURIComponent(cat.id) : "#home", text: cat ? "← " + cat.name : "← Home"}), head, vers]);
    showBar(app);
  }
  function showBar(app){
    var v = app.versions[0];
    var bar = $("actionbar");
    bar.innerHTML = "";
    var inner = el("div", {cls: "inner"}, [
      dlAnchor(app, v.version, v.url, "⬇ Download", "btn", plural(downloadsOf(app), "download")),
      copyButton(app, "", v.url), shareButton(app, ""), favButton(app)
    ]);
    bar.appendChild(inner);
    bar.hidden = false;
    document.body.classList.add("has-bar");
  }
  function hideBar(){ $("actionbar").hidden = true; document.body.classList.remove("has-bar"); }
  function viewSearch(q){
    var low = q.toLowerCase();
    var apps = visibleApps().filter(function(a){ return (a.name + " " + a.desc).toLowerCase().indexOf(low) >= 0; }).sort(byDateDesc);
    setView("Search", [section("Results for \"" + q + "\" (" + apps.length + ")"), appList(apps, "No apps match your search.")]);
  }

  /* ---------- install as an app ---------- */
  var deferredPrompt = null;
  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  function viewInstall(){
    var nodes = [section("📲 Install the store as an app")];
    if (isStandalone()){
      nodes.push(el("p", {cls: "empty", text: "The store is already running as an app."}));
    } else {
      nodes.push(el("p", {text: "Install it once and it opens in full screen from your home screen, with no browser bar."}));
      if (deferredPrompt){
        var b = el("button", {cls: "btn", type: "button", text: "📲 Install now"});
        b.addEventListener("click", function(){
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(){ deferredPrompt = null; render(); });
        });
        nodes.push(el("div", {cls: "actions"}, [b]));
      }
      nodes.push(el("p", {text: "If the button is not shown, do this in Chrome:"}));
      nodes.push(el("ol", {cls: "steps"}, [
        el("li", {text: "Tap the ⋮ menu at the top right of Chrome."}),
        el("li", {text: "Tap Install app (or Add to Home screen)."}),
        el("li", {text: "Tap Install, then open the new icon on your home screen."})
      ]));
    }
    setView("Install", nodes);
  }
  function goFullscreen(){
    var d = document.documentElement;
    var f = d.requestFullscreen || d.webkitRequestFullscreen;
    if (f){ try { var r = f.call(d); if (r && r.catch) r.catch(function(){ toast("Full screen is not available here"); }); } catch(e){ toast("Full screen is not available here"); } }
    else toast("Full screen is not available here");
    closeMenu(true);
  }

  /* ---------- routing ---------- */
  function render(){
    closeMenu(true);
    var q = $("q").value.trim();
    if (q) return viewSearch(q);
    var h = decodeURIComponent((location.hash || "#home").replace(/^#/, ""));
    var p = h.split("/");
    switch (p[0]){
      case "cats": return viewCats();
      case "cat": return viewCat(p[1]);
      case "new": return viewNew();
      case "featured": return viewFeatured();
      case "favs": return viewFavs();
      case "about": return viewPage("About", DATA.about);
      case "contact": return viewPage("Contact", DATA.contact);
      case "install": return viewInstall();
      case "app": return viewApp(p[1], p[2]);
      default: return viewHome();
    }
  }

  /* ---------- menu ---------- */
  var lastFocus = null;
  function openMenu(){
    lastFocus = document.activeElement;
    $("drawer").classList.add("on"); $("backdrop").classList.add("on");
    $("drawer").setAttribute("aria-hidden", "false"); $("menuBtn").setAttribute("aria-expanded", "true");
    setTimeout(function(){ var first = $("drawer").querySelector("a"); if (first) first.focus(); }, 80);
  }
  function closeMenu(silent){
    if (!$("drawer").classList.contains("on")) return;
    $("drawer").classList.remove("on"); $("backdrop").classList.remove("on");
    $("drawer").setAttribute("aria-hidden", "true"); $("menuBtn").setAttribute("aria-expanded", "false");
    if (!silent && lastFocus) lastFocus.focus();
  }

  /* ---------- start ---------- */
  function applyHeader(){
    $("title").textContent = DATA.title;
    $("drawerTitle").textContent = DATA.title;
    $("tagline").textContent = DATA.tagline;
    $("tagline").hidden = !DATA.tagline;
    $("greet").innerHTML = "";
    $("greet").appendChild(el("span", {text: greeting() + " - Welcome", "aria-label": greeting() + ", welcome. Today is " + todayText()}));
    $("greet").appendChild(document.createElement("br"));
    $("greet").appendChild(el("span", {text: "📅 " + todayText()}));
    $("foot").textContent = DATA.title;
    document.title = DATA.title;
  }
  function loadCounts(){
    var host = location.hostname;
    if (!/\.github\.io$/i.test(host)) return;
    var owner = host.split(".")[0], repo = location.pathname.split("/")[1];
    if (!repo || /\.html?$/i.test(repo)) return;
    fetch("https://api.github.com/repos/" + owner + "/" + repo + "/releases?per_page=100")
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rels){
        rels.forEach(function(r){ (r.assets || []).forEach(function(s){ counts[s.browser_download_url] = s.download_count; }); });
        render();
      }).catch(function(){});
  }
  function init(d){
    DATA = normalize(d);
    loadFavs(); applyHeader(); render(); loadCounts();
  }
  $("menuBtn").addEventListener("click", function(){ if ($("drawer").classList.contains("on")) closeMenu(); else openMenu(); });
  $("backdrop").addEventListener("click", function(){ closeMenu(); });
  $("drawer").addEventListener("click", function(e){ if (e.target.closest && e.target.closest("a")) closeMenu(true); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeMenu(); });
  $("q").addEventListener("input", function(){ render(); });
  window.addEventListener("hashchange", function(){ $("q").value = ""; render(); });

  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredPrompt = e; if (/^#install/.test(location.hash)) render(); });
  window.addEventListener("appinstalled", function(){ deferredPrompt = null; toast("Store installed"); });
  $("fsBtn").addEventListener("click", goFullscreen);
  if (isStandalone()){ $("installLink").hidden = true; $("fsBtn").hidden = true; }
  if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){ $("fsBtn").hidden = true; }
  if (IN_PANEL){ $("installLink").hidden = true; $("fsBtn").hidden = true; }
  if ("serviceWorker" in navigator && !IN_PANEL){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }

  fetch("apps.json?t=" + Date.now())
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(init)
    .catch(function(e){ VIEW.innerHTML = ""; VIEW.appendChild(el("p", {cls: "empty", text: "Could not load the store: " + e.message})); applyHeader(); });
})();
</script>
</body>
</html>
